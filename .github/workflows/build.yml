name: Build reviewed AltStore source

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altstore-independent-build
  cancel-in-progress: false

jobs:
  build:
    # Standard runners are free for public repositories. Never run in a private copy.
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SOURCE_COMMIT: 31972b5eb79a9df5badf25a0c073a033c7770db4
      ALTSIGN_COMMIT: 020ddb5691ffb9b75dfdd92b83a6809bbfdd1d5b
      IDEVICE_COMMIT: ad4a0eaa0f04f96616aa00214a13981c042d36f4
    steps:
      - name: Record the build environment
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/altstore-build-output"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT"
          {
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            sw_vers
            git --version
          } | tee "$OUT/build-environment.txt"
          sdk_major="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          test "$sdk_major" -ge 27

      - name: Fetch the exact reviewed source and pinned dependencies
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/liuzhe1117/AltStore.git
          git -C source fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C source submodule update --init --recursive --jobs 4
          test "$(git -C source/Dependencies/AltSign rev-parse HEAD)" = "$ALTSIGN_COMMIT"
          test "$(git -C source/Dependencies/idevice rev-parse HEAD)" = "$IDEVICE_COMMIT"
          test -f source/Dependencies/idevice/swift/Package.swift
          test -f source/Dependencies/libplist/src/Uid.cpp
          cmp source/Podfile.lock source/Pods/Manifest.lock
          git -C source submodule status --recursive > "$OUT/submodules.txt"
          if grep -q '^[-+U]' "$OUT/submodules.txt"; then
            echo 'A submodule is missing or differs from its pinned revision.' >&2
            exit 1
          fi
          git -C source status --porcelain > "$OUT/source-status-before-build.txt"
          test ! -s "$OUT/source-status-before-build.txt"
          cp source/Podfile.lock "$OUT/Podfile.lock"
          cp source/AltStore.xcworkspace/xcshareddata/swiftpm/Package.resolved "$OUT/Package.resolved"

      - name: Align the legacy libcurl container without changing architecture payloads
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Realign the pinned legacy universal archive; preserve every architecture payload."""
          import hashlib
          import json
          import struct
          import sys
          from pathlib import Path
          
          EXPECTED_INPUT = '20c8f6783165a8f2d2087508ea3a56b2b6c90f0eca743269c849d9e316c3b9a4'
          
          def repack(source, destination):
              original = Path(source).read_bytes()
              assert hashlib.sha256(original).hexdigest() == EXPECTED_INPUT
              magic, count = struct.unpack_from('>II', original)
              assert magic == 0xcafebabe and count == 5
              records = []
              for index in range(count):
                  cpu, subtype, offset, size, alignment = struct.unpack_from('>5I', original, 8+20*index)
                  assert offset >= 8+20*count and offset+size <= len(original)
                  payload = original[offset:offset+size]
                  assert payload.startswith(b'!<arch>\n')
                  records.append(dict(index=index, cpu=cpu, subtype=subtype, offset=offset,
                                      size=size, alignment=max(alignment, 3), payload=payload))
              result = bytearray(8 + 20*count)
              struct.pack_into('>II', result, 0, magic, count)
              for record in sorted(records, key=lambda r:r['offset']):
                  boundary = 1 << record['alignment']
                  result.extend(b'\0' * ((-len(result)) % boundary))
                  record['new_offset'] = len(result)
                  result.extend(record['payload'])
                  struct.pack_into('>5I', result, 8+20*record['index'], record['cpu'], record['subtype'],
                                   record['new_offset'], record['size'], record['alignment'])
              checks = []
              for record in records:
                  position = record['new_offset']
                  preserved = bytes(result[position:position+record['size']]) == record['payload']
                  assert preserved and position % 8 == 0
                  checks.append({'cpu_type':record['cpu'], 'cpu_subtype':record['subtype'],
                      'original_offset':record['offset'], 'new_offset':position,
                      'payload_sha256':hashlib.sha256(record['payload']).hexdigest(), 'payload_preserved':preserved})
              Path(destination).write_bytes(result)
              return {'input_sha256':EXPECTED_INPUT, 'output_sha256':hashlib.sha256(result).hexdigest(),
                  'all_architecture_payloads_preserved':True, 'all_payload_offsets_aligned_to_eight_bytes':True,
                  'input_bytes':len(original), 'output_bytes':len(result), 'architectures':checks}
          
          import os
          out = Path(os.environ['OUT'])
          report = repack('source/Dependencies/libcurl/libcurl.a', 'source/Dependencies/libcurl/libcurl.a')
          (out / 'libcurl-container-realignment.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - name: Resolve the locked Swift packages
        working-directory: source
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace AltStore.xcworkspace -scheme AltStore \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/altstore-packages" \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee "$OUT/package-resolution.log"

      - name: Compile the unsigned iPhone app
        working-directory: source
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AltStore.xcworkspace -scheme AltStore \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/altstore-derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/altstore-packages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            CURRENT_PROJECT_VERSION=73 \
            IPHONEOS_DEPLOYMENT_TARGET=17.4 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            build 2>&1 | tee "$OUT/build.log"

      - name: Inspect and package the unsigned app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/altstore-derived/Build/Products/Release-iphoneos/AltStore.app"
          test -f "$app/Info.plist"
          mkdir -p "$RUNNER_TEMP/altstore-package/Payload"
          ditto "$app" "$RUNNER_TEMP/altstore-package/Payload/AltStore.app"
          cd "$RUNNER_TEMP/altstore-package"
          ditto -c -k --keepParent Payload "$OUT/AltStore-independent-unsigned.ipa"
          python3 - <<'PY'
          import hashlib, json, os, plistlib, zipfile
          from pathlib import Path
          out = Path(os.environ['OUT'])
          ipa = out / 'AltStore-independent-unsigned.ipa'
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None
              main = plistlib.loads(archive.read('Payload/AltStore.app/Info.plist'))
              widget = plistlib.loads(archive.read('Payload/AltStore.app/PlugIns/AltWidgetExtension.appex/Info.plist'))
              assert main['CFBundleIdentifier'] == 'com.rileytestut.AltStore'
              assert widget['CFBundleIdentifier'] == 'com.rileytestut.AltStore.AltWidget'
              assert main['CFBundleVersion'] == widget['CFBundleVersion'] == '73'
              assert not any(n.endswith(('.p12', '.key', '.mobileprovision')) for n in archive.namelist())
          manifest = {
              'source_repository': 'https://github.com/liuzhe1117/AltStore',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'altsign_commit': os.environ['ALTSIGN_COMMIT'],
              'idevice_commit': os.environ['IDEVICE_COMMIT'],
              'workflow_repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'version': main['CFBundleShortVersionString'],
              'build': main['CFBundleVersion'],
              'sha256': hashlib.sha256(ipa.read_bytes()).hexdigest(),
              'libcurl_container_realignment': json.loads((out / 'libcurl-container-realignment.json').read_text()),
              'signing_performed': False,
              'apple_account_credentials_supplied': False,
          }
          (out / 'build-manifest.json').write_text(json.dumps(manifest, indent=2))
          (out / 'SHA256SUMS.txt').write_text(manifest['sha256'] + '  ' + ipa.name + '\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload the unsigned app and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AltStore-independent-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
